<header><div class="identity"><span class="avatar">PF</span><span>Pipers Family</span></div><span class="nav">Home</span><time id="clock"></time></header>
<section class="hero"><div class="eyebrow">YOUR SPACE. YOUR SCREEN.</div><h1 id="hero-title">Make yourself<br>at home.</h1><p id="hero-copy">Your favourites, all together.</p></section>
<main><section class="section"><h2>Watch something great</h2><div class="row apps">
<button class="tile netflix" data-app="netflix" data-title="Netflix" data-copy="Settle in for your next favourite." aria-label="Open Netflix"><span class="art"><svg><use href="#netflix" xlink:href="#netflix" xmlns:xlink="http://www.w3.org/1999/xlink"/></svg></span><span class="label">Netflix</span></button>
<button class="tile youtube" data-app="youtube.leanback.v4" data-title="YouTube" data-copy="Follow your curiosity." aria-label="Open YouTube"><span class="art"><svg><use href="#youtube" xlink:href="#youtube" xmlns:xlink="http://www.w3.org/1999/xlink"/></svg></span><span class="label">YouTube</span></button>
<button class="tile jellyfin" data-app="org.jellyfin.webos" data-title="Jellyfin" data-copy="Your collection. Your movie night." aria-label="Open Jellyfin"><span class="art"><svg><use href="#jellyfin" xlink:href="#jellyfin" xmlns:xlink="http://www.w3.org/1999/xlink"/></svg></span><span class="label">Jellyfin</span></button>

<section class="section lower"><div class="inputs"><h2>Connected to your TV</h2><div class="row" id="inputs"></div></div><div class="essentials"><h2>The essentials</h2><div class="row" id="essentials"></div></div></section></main>
<footer><span>Arrows to explore <i>·</i> OK to open <i>·</i> Back to LG Home</span><span>Made for the Pipers.</span></footer>
